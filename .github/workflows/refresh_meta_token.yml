name: "🔑 Refresh token Meta (mensuel)"
# Ré-échange le token long-lived Meta (~60j) et met à jour le secret
# META_LONG_LIVED_TOKEN de CE dépôt (via GH_PAT secrets:write). Le script cible
# GITHUB_REPOSITORY (= pronogo-machine) automatiquement. Alerte email si échec.

on:
  schedule:
    - cron: "0 3 1 * *"   # 1er du mois, 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test seulement (--dry) : échange le token mais N'ÉCRIT PAS le secret"
        type: boolean
        default: false
      simulate_failure:
        description: "🔥 EXERCICE : force un échec pour vérifier l'alerte email"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-meta-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rafraîchir le token + mettre à jour le secret
        env:
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # PAT secrets:write sur pronogo-machine
        run: |
          if [ "${{ github.event.inputs.simulate_failure }}" = "true" ]; then
            echo "🔥 EXERCICE : échec FORCÉ (aucun token ni secret touché)."; exit 1
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python _PILOTAGE/tools/refresh_meta_token_cloud.py --dry
          else
            python _PILOTAGE/tools/refresh_meta_token_cloud.py --set-secret
          fi

      - name: Alerte email si échec (observateur qui alerte)
        # v2 (08/08) : l'envoi passait par _PILOTAGE/tools/ci_alert_email.py, un
        # script qui vit DANS fc-pronox — si le checkout (1er step) échoue (PAT
        # mort), l'alerte était impossible. Envoi autonome désormais.
        if: failure()
        id: drill
        run: |
          SUBJECT="⚠️ PronoGo — ÉCHEC refresh token Meta (publi cloud en danger)"
          if [ "${{ github.event.inputs.simulate_failure }}" = "true" ]; then
            SUBJECT="[🔥 EXERCICE — TEST] $SUBJECT"
          fi
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

      - name: Envoi de l'alerte (Brevo direct, zéro dépendance fc-pronox)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.BREVO_SMTP_USER }}
          password: ${{ secrets.BREVO_SMTP_KEY }}
          subject: ${{ steps.drill.outputs.subject }}
          to: ${{ secrets.ALERT_EMAIL }}
          reply_to: pronogo.dev@gmail.com
          from: "PronoGo Machine <pronogo.dev@gmail.com>"
          body: |
            Le refresh mensuel du token long-lived Meta a échoué (ou EXERCICE si l'objet le dit).
            Risque : à l'expiration (~60j) la publication IG/FB casse en silence.
            Action : relancer refresh_meta_token en dry_run pour voir l'erreur, ou
            régénérer un token à la main (Graph API Explorer).
            Si le log montre « could not read Username for 'https://github.com' » :
            c'est le jeton FCPRONOX_PAT qui est mort → github.com/settings/tokens
            → régénérer (scope repo) → pronogo-machine/settings/secrets/actions → FCPRONOX_PAT.
            Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
