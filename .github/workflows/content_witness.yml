name: "🩺 Témoin contenu (alerte si rien produit)"
# TÉMOIN DE BOUT EN BOUT (v2 — 28/07, GO fondateur après 3 jours de pannes
# silencieuses). Le v1 ne vérifiait qu'une chose (« du contenu existe ») ; les
# vraies pannes étaient dans les COUTURES : chaînage usine→menu mort en silence
# (filtre glob, 26-28/07), mail sauvé par le cron de secours, sélection maigre.
# Le v2 vérifie les RÉSULTATS de chaque cycle, pas les étapes :
#   1. l'usine a tourné (run success dans la fenêtre du cycle)
#   2. le menu a tourné ET par le CHAÎNAGE (event workflow_run) — si c'est le
#      cron de secours qui a sauvé la journée → ALERTE même si tout est vert
#   3. le mail des posts est parti
#   4. le Journaliste a committé ses fiches · le Rédacteur (QC) a committé
#   5. selection_du_jour.json committée dans la fenêtre, ≥2 cartes, écartés motivés
#   6. des posts datés du jour existent (contrôle v1 conservé)
# Le moindre écart → UN mail d'alerte avec le diagnostic maillon par maillon.
# 0 jeton, gratuit.

on:
  schedule:
    - cron: "30 12 * * *"   # 14h30 Paris — APRÈS la fin réelle de l'usine du matin (mesurée ~13h16 Paris)
    - cron: "15 22 * * *"   # 00h15 Paris (été) — bilan du cycle du SOIR
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle à contrôler (auto = déduit de l'heure)"
        type: choice
        options: [auto, matin, soir]
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fc-pronox (privé) — NON-FATAL
        id: checkout_fc
        # ⚠️ v3 (08/08) : ce checkout était le 1er step ET fatal → quand le PAT
        # est mort (panne des 07-08/08), le témoin mourait AVANT tout diagnostic
        # et la panne totale était MUETTE — l'inverse exact de sa raison d'être.
        # Il est désormais non-fatal : son échec devient le PREMIER écart alerté.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 1   # ⚠️ depth 300 = >10 min (repo plein de médias) → run annulé
                           # au 1er test 28/07 ; les commits du cycle se lisent via l'API.

      - name: Bilan de bout en bout du cycle
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FCPRONOX_PAT: ${{ secrets.FCPRONOX_PAT }}
          MACHINE_REPO: ${{ github.repository }}
          CYCLE_INPUT: ${{ inputs.cycle || 'auto' }}
          CHECKOUT_OK: ${{ steps.checkout_fc.outcome }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess

          UTC = dt.timezone.utc
          now = dt.datetime.now(UTC)
          cycle = os.environ.get("CYCLE_INPUT", "auto")
          if cycle == "auto":
              cycle = "matin" if 3 <= now.hour < 15 else "soir"
          if cycle == "matin":
              since = now.replace(hour=4, minute=30, second=0, microsecond=0)
              if now.hour < 4:
                  since -= dt.timedelta(days=1)
          else:
              since = now.replace(hour=17, minute=30, second=0, microsecond=0)
              if now.hour < 15:      # contrôle après minuit UTC → fenêtre d'hier soir
                  since -= dt.timedelta(days=1)
          date_paris = (since + dt.timedelta(hours=2)).date().isoformat()  # été
          repo = os.environ["MACHINE_REPO"]
          ecarts, ok, encore = [], [], []

          # 0. LE DÉPÔT LUI-MÊME (leçon 07-08/08 : PAT mort → checkout fatal →
          # témoin muet pendant toute la panne). Un checkout refusé est TOUJOURS
          # un écart alerté, même si la chaîne semble « encore en cours ».
          pat_mort = os.environ.get("CHECKOUT_OK") != "success"
          if pat_mort:
              ecarts.append(
                  "fc-pronox INACCESSIBLE (checkout refusé) — jeton FCPRONOX_PAT "
                  "mort/expiré ? Réparer : github.com/settings/tokens → régénérer "
                  "(scope repo) → coller dans pronogo-machine/settings/secrets/"
                  "actions → FCPRONOX_PAT. La machine repart seule ensuite.")

          def runs(wf):
              out = subprocess.run(
                  ["gh", "api", f"repos/{repo}/actions/workflows/{wf}/runs?per_page=30"],
                  capture_output=True, text=True)
              if out.returncode != 0:
                  return []
              rs = json.loads(out.stdout).get("workflow_runs", [])
              return [r for r in rs
                      if dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) >= since]

          # 1. USINE — ⚠️ mesuré le 02/08 : l'usine du MATIN dure ~3h35
          # (07:41 → 11:16 UTC) et celle du soir ~1h30. Le témoin passait AVANT
          # sa fin et annonçait « ABSENT » alors qu'elle tournait : faux positif
          # systématique. On distingue désormais EN COURS (pas une panne) de
          # ABSENT (vraie panne), et le bilan est reporté si tout tourne encore.
          all_us = runs("usine_tipster.yml")
          us = [r for r in all_us if r["conclusion"] == "success"]
          running = [r for r in all_us if r["status"] != "completed"]
          if us:
              ok.append("usine : run success %s" % us[0]["created_at"])
          elif running:
              encore.append("usine : EN COURS depuis %s (pas une panne — bilan "
                            "prématuré)" % running[0]["created_at"])
          else:
              ecarts.append("usine : ABSENT dans la fenêtre — la production du "
                            "cycle n'a pas tourné")

          # 2. MENU + CHAÎNAGE (la panne des 26-28/07 : secours vert, chaînage mort)
          ms = [r for r in runs("build_menu.yml") if r["conclusion"] == "success"]
          if not ms:
              (encore if encore else ecarts).append(
                  "menu : AUCUN run success — pas de page de validation ce cycle")
          elif any(r["event"] == "workflow_run" for r in ms):
              ok.append("menu : chaîné à la fin de l'usine (workflow_run) ✓")
          else:
              ecarts.append("menu : construit UNIQUEMENT par le cron de secours (%s) — le CHAÎNAGE usine→menu est mort, à réparer même si la journée est sauvée"
                            % ", ".join(sorted({r["event"] for r in ms})))

          # 3. MAIL
          mail = [r for r in runs("mail_posts.yml") if r["conclusion"] == "success"]
          if mail:
              ok.append("mail : parti %s" % mail[0]["created_at"])
          else:
              (encore if encore else ecarts).append(
                  "mail : ABSENT — aucun email de validation envoyé ce cycle")

          # 4. COMMITS fc-pronox (Journaliste + QC Rédacteur) — via API (checkout depth 1)
          def fc_commits(path=None):
              # ⚠️ since.isoformat() finit en « +00:00 » : le + non encodé devient un
              # ESPACE dans l'URL → GitHub décale la fenêtre et perd les 1ers commits
              # (faux positif « Journaliste absent » au test du 28/07). Format Z.
              url = ("repos/MehdiBou7a/fc-pronox/commits?per_page=100&since="
                     + since.strftime("%Y-%m-%dT%H:%M:%SZ"))
              if path:
                  url += "&path=" + path
              out = subprocess.run(["gh", "api", url], capture_output=True, text=True,
                                   env={**os.environ, "GH_TOKEN": os.environ["FCPRONOX_PAT"]})
              if out.returncode != 0:
                  return None
              return [c["commit"]["message"].splitlines()[0] for c in json.loads(out.stdout)]

          msgs = fc_commits()
          if msgs is None:
              ecarts.append("commits fc-pronox : API illisible (PAT ?)")
              msgs = []
          for prefix, quoi in [("journaliste-claude:", "Journaliste (fiches du cycle)"),
                               ("redacteur-en-chef:", "QC Rédacteur en chef")]:
              if any(m.startswith(prefix) for m in msgs):
                  ok.append(quoi + " : commit présent ✓")
              else:
                  ecarts.append(quoi + " : AUCUN commit dans la fenêtre du cycle")

          # 5. SÉLECTION (committée ce cycle + substance)
          sel_log = fc_commits("marketing/content_machine/selection_du_jour.json") or []
          if not sel_log:
              ecarts.append("sélection : selection_du_jour.json PAS committée ce cycle (sélecteur pas passé ?)")
          else:
              try:
                  sel = json.load(open("marketing/content_machine/selection_du_jour.json", encoding="utf-8"))
                  n = len(sel.get("selection", []))
                  sans_raison = [e for e in sel.get("ecartes", []) if not e.get("raison")]
                  # VEILLE DU SOIR (refonte fondateur 02/08) : le cycle du soir ne
                  # fabrique QUE la grosse info du jour, une carte au maximum, et rien
                  # du tout si rien ne franchit la barre. Y crier « jour très maigre »
                  # serait un faux positif systématique — c'est le comportement voulu.
                  if cycle == "soir":
                      ok.append("veille du soir : %d carte(s) — normal (une carte max, zéro si rien ne passe la barre) ✓" % n)
                  elif n < 2:
                      ecarts.append("sélection : %d carte(s) seulement — jour très maigre ou étage cassé, à regarder" % n)
                  else:
                      ok.append("sélection : %d cartes · %d écartés motivés ✓" % (n, len(sel.get("ecartes", []))))
                  if sans_raison:
                      ecarts.append("sélection : %d écarté(s) SANS raison journalisée" % len(sans_raison))
              except Exception as e:
                  ecarts.append("sélection : fichier illisible (%s)" % str(e)[:60])

          # 6. POSTS DU JOUR (contrôle v1 conservé)
          jour = "marketing/JOUR/%s" % date_paris
          fichiers = os.listdir(jour) if os.path.isdir(jour) else []
          if any(f.startswith(date_paris) for f in fichiers):
              ok.append("posts : contenu daté %s présent ✓" % date_paris)
          elif cycle == "soir":
              ok.append("veille du soir : aucun post — rien ne franchissait la barre, c'est un résultat, pas une panne ✓")
          else:
              ecarts.append("posts : AUCUN fichier daté %s dans marketing/JOUR/" % date_paris)

          if encore and not pat_mort:
              # la chaîne n'a pas fini : un bilan maintenant serait un faux
              # positif. On le DIT (visible dans le run) et on n'alerte pas.
              # (SAUF si le PAT est mort : là, rien ne finira jamais → on alerte.)
              print("⏳ TÉMOIN — chaîne ENCORE EN COURS, bilan reporté :")
              for l in encore:
                  print("  ⏳ " + l)
              for l in ok:
                  print("  ✅ " + l)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("alert=0" + chr(10) + "n=0" + chr(10)
                          + ("cycle=%s" % cycle) + chr(10)
                          + ("date=%s" % date_paris) + chr(10)
                          + "body=chaine en cours" + chr(10))
              raise SystemExit(0)
          print("🩺 TÉMOIN BOUT-EN-BOUT — cycle %s du %s (fenêtre depuis %sZ)" % (cycle, date_paris, since.strftime("%H:%M")))
          for l in ok:
              print("  ✅ " + l)
          for l in ecarts:
              print("  ❌ " + l)

          body = ["Bilan du cycle %s du %s — %d écart(s) détecté(s) :" % (cycle, date_paris, len(ecarts)), ""]
          body += ["❌ " + l for l in ecarts] + ["⏳ " + l for l in encore]
          body += [""] + ["✅ " + l for l in ok]
          body += ["", "Runs : https://github.com/%s/actions" % repo]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("alert=%d\n" % (1 if ecarts else 0))
              f.write("n=%d\ncycle=%s\ndate=%s\n" % (len(ecarts), cycle, date_paris))
              f.write("body<<TEMOIN_EOF\n" + "\n".join(body) + "\nTEMOIN_EOF\n")
          PY

      - name: Alerte email avec diagnostic maillon par maillon
        # v3 (08/08) : l'ancien envoi passait par _PILOTAGE/tools/ci_alert_email.py
        # — un script qui vit DANS fc-pronox : checkout mort = alerte impossible.
        # L'envoi est désormais autonome (Brevo direct, aucun fichier requis).
        if: steps.check.outputs.alert == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.BREVO_SMTP_USER }}
          password: ${{ secrets.BREVO_SMTP_KEY }}
          subject: "🩺 PronoGo — ${{ steps.check.outputs.n }} écart(s) sur le cycle ${{ steps.check.outputs.cycle }} (${{ steps.check.outputs.date }})"
          to: ${{ secrets.ALERT_EMAIL }}
          reply_to: pronogo.dev@gmail.com
          from: "PronoGo Machine <pronogo.dev@gmail.com>"
          body: ${{ steps.check.outputs.body }}

  # 🚨 Filet du filet (08/08) : si le job témoin lui-même PLANTE (bug, quota…),
  # une alerte part quand même — via le workflow réutilisable, zéro dépendance
  # fc-pronox, anti-rafale intégré.
  alerte-panne:
    needs: witness
    if: failure()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alerte_echec.yml
    secrets: inherit
