name: "🏭 Usine de contenu (actu + memes + produit + tipster) — cloud gratuit"
# Usine COMPLÈTE offline (0 jeton). Le code + les données vivent dans fc-pronox
# (privé), checkout via FCPRONOX_PAT, l'état est recommitté dans fc-pronox.
# Chaîne : actu 4 phases (récolte→comprend→consolide→sélectionne) → flop → memes →
# produit → tipster (grille + Goalardo). Chaque producteur émet une carte posts/
# → mail + validation + publi FB/IG. Snapshot matchs via scénario admin read-only.

on:
  schedule:
    # Chaîne événementielle 26/07 : l'usine démarre TÔT (le retard GH fait le reste,
    # +1h à +2h30 mesuré) puis ATTEND le commit « fiches » du Journaliste (step
    # ci-dessous) — elle part dans les 3 min qui suivent, plus de course aux crons.
    - cron: "20 5 * * *"   # 07h20 Paris (été) — usine du MATIN (attend le Journaliste ~06:30-08:35 UTC)
    - cron: "20 18 * * *"  # 20h20 Paris (été) — usine du SOIR (attend le Journaliste ~20:30 UTC)
  workflow_dispatch:
    inputs:
      competitions:
        description: "Compétitions (liste virgules)"
        type: string
        default: "CL,EL,ECL,FL1,PL,PD,BL1,SA"

permissions:
  contents: read

concurrency:
  group: usine-contenu
  cancel-in-progress: false

jobs:
  usine:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # attente Journaliste (max 3h) + production (90 min qualité-avant-chrono) — minutes gratuites repo public
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 50   # profondeur pour retrouver le commit « fiches » du cycle dans le log

      - name: Attendre les fiches du Journaliste (chaînage événementiel, max 3h)
        # La routine Claude n'est déclenchable que par cron (autre compte) : on inverse
        # le lien — l'usine poll le commit « journaliste-claude: … fiches » du CYCLE
        # (matin = aujourd'hui ; soir = après 18:00 UTC pour ignorer les fiches du matin)
        # et démarre dans les 3 min qui suivent. Timeout 3h → filet Groq (comme avant).
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 15 ]; then SINCE="$(date -u +%F)T00:00:00Z"; CYCLE="matin"; else SINCE="$(date -u +%F)T18:00:00Z"; CYCLE="soir"; fi
          echo "Cycle $CYCLE — attente d'un commit 'journaliste-claude … fiches' postérieur à $SINCE"
          for i in $(seq 1 60); do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$(git log --since="$SINCE" --grep='journaliste-claude' --grep='fiches' --all-match --format=%h -1)" ]; then
              echo "✅ Fiches du Journaliste trouvées (essai $i) — l'usine démarre."
              exit 0
            fi
            sleep 180
          done
          echo "::warning::Journaliste muet après 3h — l'usine part en filet Groq (comportement d'avant)."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances (rendu + réseau + montage photo réelle)
        # opencv+onnxruntime = détection visage (yunet) + détourage u2netp (modèles
        # BUNDLÉS dans fc-pronox, zéro téléchargement). rembg = détourage premium
        # isnet (télécharge son modèle au 1er usage ; si échec → fallback u2netp).
        run: pip install --quiet Pillow requests feedparser opencv-python-headless onnxruntime numpy rembg

      - name: Cache modèles rembg (~170 Mo — fini le re-téléchargement à chaque run)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-models-v1

      - name: Snapshot matchs multi-compétitions (scénario admin read-only)
        env:
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          COMPS="${{ github.event.inputs.competitions }}"; COMPS="${COMPS:-CL,EL,ECL,FL1,PL,PD,BL1,SA}"
          mkdir -p marketing/tools/.api_cache
          echo '[]' > snap.json
          IFS=',' read -ra LIST <<< "$COMPS"
          for COMP in "${LIST[@]}"; do
            URL="https://europe-west9-fc-pronox.cloudfunctions.net/syncTrigger?scenario=export-matches-snapshot&competition=${COMP}"
            if curl -sS -f -H "x-admin-token: ${ADMIN_SYNC_TOKEN}" "$URL" -o /tmp/resp.json \
               && jq -e '.result.matches | type == "array"' /tmp/resp.json > /dev/null; then
              jq -s '.[0] + .[1]' snap.json <(jq '.result.matches' /tmp/resp.json) > merged.json && mv merged.json snap.json
            fi
          done
          mv snap.json marketing/tools/.api_cache/wc_matches_snapshot.json
          echo "Snapshot: $(jq 'length' marketing/tools/.api_cache/wc_matches_snapshot.json) matchs."

      # ── CYCLE (correctif fondateur 02/08) ────────────────────────────────
      # Le soir n'est plus une deuxieme journee complete. Constat mesure sur le
      # cycle du 01/08 : memes 15 scripts que le matin, 6 posts distincts, mail
      # a 23h25 Paris puis un second a 01h29 — le fondateur les lisait perimes le
      # lendemain. Le soir devient une VEILLE : la grosse info du jour, une carte
      # maximum, et rien du tout si rien ne franchit la barre.
      - name: Quel cycle (matin complet ou veille du soir)
        run: |
          if [ "$(date -u +%H)" -lt 15 ]; then
            echo 'PRONOGO_VEILLE=0' >> "$GITHUB_ENV"; echo 'Cycle MATIN — production complete.'
          else
            echo 'PRONOGO_VEILLE=1' >> "$GITHUB_ENV"; echo 'Cycle SOIR — VEILLE : la grosse info du jour, une carte maximum.'
          fi

      - name: Lancer l'usine (récap ✅/❌ par script, non bloquant mais VISIBLE)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}   # fonds Flux (10 € fondateur) — absent/épuisé → fallback bibliothèque, 0 crash
          PYTHONUNBUFFERED: "1"   # logs en DIRECT (pas de buffer perdu si un script traîne/est tué)
          PRONOGO_VEILLE: ${{ env.PRONOGO_VEILLE }}   # 1 = veille du soir (une carte max, pas de mercato du jour)
        run: |
          fail=0
          # Le SOIR ne lance que la chaine actu : memes, flop, produit, grille,
          # blessures, journal tipster et edition sont des formats de recapitulatif
          # ou d'animation — ils appartiennent au matin. carnet_sweep clot le cycle :
          # tout sujet selectionne dont la carte n'est jamais sortie part au carnet
          # de reports au lieu d'etre perdu (la memoire 30 j le marque des la
          # selection, pas a la publication).
          BASE="marketing/tools/rss_ingest.py marketing/tools/comprehend.py marketing/tools/consolidate.py marketing/tools/select_edito.py marketing/tools/accents_fix.py marketing/tools/actu_run.py"
          SUITE="marketing/tools/scores_run.py marketing/tools/flop_run.py marketing/tools/meme_run.py marketing/tools/produit_run.py marketing/tools/injury_detect.py marketing/tools/grille_jour.py marketing/tools/goalardo_candidates.py marketing/tools/journal_tipster.py marketing/tools/edition_run.py"
          if [ "$PRONOGO_VEILLE" = "1" ]; then SCRIPTS="$BASE marketing/tools/carnet_sweep.py"; else SCRIPTS="$BASE $SUITE marketing/tools/carnet_sweep.py"; fi
          for S in $SCRIPTS ; do
            echo "──────── $S ────────"
            if timeout -k 20 1800 python -X utf8 "$S"; then echo "✅ OK  $S"; else echo "❌ ÉCHEC  $S (code $?)"; fail=1; fi   # 30 min max PAR script : un déraillement ne tue plus les autres phases
          done
          echo "════════ RÉCAP USINE ════════"
          [ "$fail" = "1" ] && echo "::warning::au moins un script a échoué (voir ci-dessus)" || echo "Tous les scripts OK."

      - name: Committer les cartes + sorties (si changements)
        run: |
          git config user.name "PronoGo Cloud Usine"
          git config user.email "pronogo.dev@gmail.com"
          git add marketing/reports/routines/posts/ \
                  marketing/reports/routines/grille_jour/ \
                  marketing/reports/routines/bilan/ \
                  marketing/content_machine/a_valider/ \
                  marketing/content_machine/*.json \
                  marketing/content_machine/GOALARDO_RDV.json \
                  marketing/content_machine/carnet_reports.json \
                  marketing/photo_staging/ \
                  marketing/assets/bg_library/ \
                  _PILOTAGE/tipster/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à committer (usine du jour déjà présente)."; exit 0
          fi
          git commit -m "usine(contenu) $(date -u +%Y-%m-%d) [cloud]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Push OK (essai $i)."; exit 0; fi
            # -X theirs : conflit de CONTENU sur un fichier régénéré (carte/page du
            # jour) => la version de CE run gagne. Sans ça, run perdu (21/07 13h :
            # conflit sur goalardo-officiel.html, production entière jetée).
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "::error::Push échoué après 5 essais — la production du cycle N'EST PAS sur main. Un run VERT aurait caché cette perte (motif de l'incident du 21/07)." ; exit 1

      - name: QC Redacteur en chef (session Claude DANS l'usine — evenementiel 27/07)
        # Les cartes viennent d'etre committees par CE job -> le QC tourne dans la
        # seconde, authentifie par le jeton d'abonnement (claude setup-token,
        # secret CLAUDE_CODE_OAUTH_TOKEN). L'ancien appel API routines (mauvaise
        # porte : 401) est supprime. La routine claude.ai (08:45/10:45/20:45/22:45)
        # reste le filet — no-op si le rapport du cycle existe deja.
        if: success()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "(secret CLAUDE_CODE_OAUTH_TOKEN absent -> QC par la routine de secours)"; exit 0
          fi
          git pull --rebase origin main || true
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || { echo "::warning::install claude-code KO -> routine de secours"; exit 0; }
          cat > /tmp/qc_prompt.txt <<'QCEOF'
          Tu es le REDACTEUR EN CHEF de PronoGo (app foot fantasy FR). Tu tournes DANS le workflow de l'usine, juste apres la fabrication des cartes : les posts du jour sont DEJA dans ce depot (checkout fc-pronox, branche main a jour). ZERO attente necessaire. Travaille sans trainer, la qualite prime.
          ETAPE 0 : date=$(date -u +%F) ; cycle = matin si heure UTC < 15, sinon soir. Si _PILOTAGE/rapports/${date}_redacteur_en_chef_${cycle}.html existe deja -> QC deja fait, STOP en une ligne. Sinon : git config user.name "PronoGo Redacteur QC" && git config user.email "pronogo.dev@gmail.com".
          OU REGARDER : cartes = marketing/reports/routines/posts/${date}_instagram_*.html (+ .png jumeau, REGARDE les images) ; legende publiable dans <div id="cap"> ; chaine du jour = marketing/content_machine/{infos_comprises,sujets_du_jour,selection_du_jour,posts_du_jour}.json ; memes = marketing/content_machine/a_valider/.
          MISSION (traite d'abord les cartes marquees "PRIORITE QC", puis "LA UNE") :
          1) CONTROLE DE LA CHAINE : grosse actu comprise mais SANS carte = anomalie a signaler en tete de rapport. Carte CITATION : le verbatim affiche doit etre EXACTEMENT celui de la fiche (un mot change = depublication). Carte CHIFFRE : le chiffre doit venir de la fiche.
          2) LEGENDES : reecris chaque legende faible dans le <div id="cap"> : 1re ligne = HOOK autonome <= 90 caracteres, recit vivant, pro-France/PSG (on chambre les rivaux, JAMAIS la France ni le PSG), 1-2 emojis max, 3-5 hashtags, ACCENTS FRANCAIS OBLIGATOIRES. INTERDIT : chiffre/nom/fait absent de la fiche, mot RECORD, "selon X" hors rumeur, noms deformes.
          3) GATE VISUEL — REPARER D'ABORD, DEPUBLIER EN DERNIER RECOURS (regle fondateur 27/07 : « on ne perd JAMAIS une info ») : regarde chaque .png du jour UN PAR UN. Defauts eliminatoires : visage coupe / sujet sans visage / mauvaise personne / texte illisible ou recouvert / caractere casse / detourage rate / photo d'archive evidente. Carte defectueuse -> SUPPRIME .html ET .png (versions _instagram_ ET _facebook_). AVANT toute suppression, si le defaut est de FABRICATION (texte qui deborde, textes superposes, caractere casse) : REPARE — raccourcis l1/l2 du post concerne dans marketing/content_machine/posts_du_jour.json (les FAITS restent identiques, seule la formulation raccourcit), puis pip install --quiet Pillow opencv-python-headless onnxruntime numpy rembg et python -X utf8 marketing/tools/actu_run.py (les cles GROQ/FAL sont fournies a cette etape), et VERIFIE le PNG regenere. Depublie SEULEMENT si la reparation echoue ou si le defaut est une PHOTO (mauvaise personne, visage coupe — pas reparable ici). TOUTE depublication definitive : libere la memoire 30j du sujet pour qu'il soit refabrique au prochain cycle — python -X utf8 -c "import importlib.util;s=importlib.util.spec_from_file_location('dh','marketing/tools/dedup_history.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m);print('liberees:', m.release(['MOT1','MOT2']))" (MOT1/MOT2 = mots du slug de la carte, ex 'bradley','barcola') — et note la carte dans le rapport comme « depubliee, sujet libere, a refabriquer ». Doute de GOUT on garde, doute sur un DEFAUT liste on repare/supprime. Chaque suppression listee dans le rapport.
          4) RAPPORT : _PILOTAGE/rapports/${date}_redacteur_en_chef_${cycle}.html — HTML style autonome (fond #0d1117, cartes #161b22, or #e8b84a, zero jargon) : note /10 du cycle, anomalies, cartes depubliees (fichier + defaut), legendes AVANT->APRES, 3 conseils pour l'usine.
          5) COMMIT + PUSH main : message exact "redacteur-en-chef: ${date} ${cycle} — QC + depublications + rapport [routine]" (le menu et le mail attendent ce mot-cle). Fichiers autorises UNIQUEMENT : les .html/.png de marketing/reports/routines/posts/, marketing/content_machine/{posts_du_jour,history}.json si tu as repare/libere, et ton rapport _PILOTAGE/rapports/. Ne touche JAMAIS marketing/tools/, lib/, functions/, les .json d'etat. Push refuse -> git pull --rebase origin main puis reessaie, 5 fois.
          QCEOF
          claude -p "$(cat /tmp/qc_prompt.txt)" --model sonnet --dangerously-skip-permissions             && echo "OK QC Redacteur termine (evenementiel)"             || echo "::warning::QC Claude KO -> la routine de secours prendra le relais"

      - name: Enchaîner le menu (dispatch direct — filet du workflow_run)
        # Constat test E2E 26/07 : le workflow_run usine→menu n'est PAS parti
        # (alors que menu→mail fonctionne). Filet : dispatch explicite via GH_PAT
        # (GITHUB_TOKEN ne déclenche pas d'autres workflows). Doublon sans risque :
        # build_menu est idempotent + concurrency group build-menu.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "(GH_PAT absent → workflow_run/crons secours)"; exit 0; fi
          sleep 20
          gh workflow run build_menu.yml --repo MehdiBou7a/pronogo-machine \
            && echo "✅ menu dispatché" \
            || echo "::warning::dispatch menu KO — workflow_run/crons secours restent"

  # 🚨 Filet anti-silence (08/08) : si le job ci-dessus ÉCHOUE — y compris dès
  # son PREMIER step (checkout fc-pronox, PAT mort : la panne muette des
  # 07-08/08) — une alerte email part via alerte_echec.yml. Zéro dépendance à
  # fc-pronox, anti-rafale (un seul mail à l'entrée en panne).
  alerte-panne:
    needs: usine
    if: failure()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alerte_echec.yml
    secrets: inherit
