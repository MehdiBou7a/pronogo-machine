name: "📋 Menu de validation du jour (cloud gratuit)"
# Écrit approval_menus/{date} (lu par la mini-page de validation) + héberge les
# vignettes. 100% mécanique, idempotent (set sans merge → rejouable).
# Déclenché sur horaire (après les producteurs de posts) au lieu du push posts/**
# (le repo public ne peut pas observer les push du repo privé fc-pronox).

on:
  # PRIMAIRE (chaîne événementielle 26/07) : déclenché dès la FIN de l'usine →
  # menu construit pile quand le contenu est prêt, puis le mail part (workflow_run
  # sur ce workflow). Les crons ci-dessous sont un FILET DE SECOURS (idempotent).
  workflow_run:
    # ⚠️ Le filtre `workflows:` est un MOTIF (glob GitHub) : les « + » du nom complet
    # de l'usine étaient lus comme des quantificateurs → le chaînage n'a JAMAIS
    # tiré (constaté 28/07 : 0 run workflow_run depuis le 26/07 ; tournage→short,
    # sans « + », chaîne très bien). Motif préfixe = insensible aux caractères pièges.
    workflows: ["🏭 Usine de contenu*"]
    types: [completed]
  schedule:
    - cron: "30 11 * * *"   # 13h30 Paris — secours matin (bien après l'usine chaînée)
    - cron: "30 22 * * *"   # 00h30 Paris — secours soir
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Aperçu seulement (--dry) : construit le menu SANS héberger ni écrire"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-menu
  cancel-in-progress: false

jobs:
  build-menu:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 90   # attente QC Rédacteur (max 60 min) + construction
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 50   # profondeur pour retrouver le commit QC « redacteur-en-chef »

      - name: Attendre le QC du Rédacteur en chef (max 60 min — la page ne montre jamais l'état pré-contrôle)
        # Ordre de chaîne 26/07 : usine → Rédacteur (dépublications) → menu → mail.
        # Le menu attend le commit « redacteur-en-chef » du cycle pour ne jamais
        # afficher une carte dépubliée. Jamais bloquant : 60 min max, skip si déjà
        # mailé (rejeu tardif) ou si minuit Paris approche. Les dépublications
        # tardives restent couvertes par le dispatch best-effort du Rédacteur.
        run: |
          DATE=$(TZ=Europe/Paris date +%Y-%m-%d)
          if [ -f "marketing/reports/routines/posts/.mailed_$DATE" ]; then
            echo "Déjà mailé le $DATE → pas d'attente (reconstruction directe)."; exit 0
          fi
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 15 ]; then SINCE="$(date -u +%F)T00:00:00Z"; else SINCE="$(date -u +%F)T15:00:00Z"; fi
          echo "Attente d'un commit 'redacteur-en-chef' postérieur à $SINCE"
          for i in $(seq 1 20); do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$(git log --since="$SINCE" --grep='redacteur-en-chef' --format=%h -1)" ]; then
              echo "✅ QC du Rédacteur trouvé (essai $i) — construction du menu."
              exit 0
            fi
            PH=$(TZ=Europe/Paris date +%H); PM=$(TZ=Europe/Paris date +%M)
            if [ "$PH" = "23" ] && [ "$PM" -ge 40 ]; then
              echo "::warning::Minuit Paris approche — construction sans attendre le QC."
              exit 0
            fi
            sleep 180
          done
          echo "::warning::Pas de commit QC après ~60 min — construction quand même."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node (pour firebase-tools)
        if: github.event.inputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer firebase-tools
        if: github.event.inputs.dry_run != 'true'
        run: npm install -g firebase-tools

      - name: Construire + écrire le menu
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry"; fi
          python -X utf8 marketing/tools/build_approval_menu.py $ARGS

      # BOUCLAGE : ramène les retours du fondateur (décisions + « pourquoi ») dans
      # FEEDBACK_LOG.json → les routines de contenu liront `feedback.py digest`.
      - name: Collecte des retours du fondateur (bouclage)
        if: github.event.inputs.dry_run != 'true'
        env:
          APPROVAL_LINK_TOKEN: ${{ secrets.APPROVAL_LINK_TOKEN }}
          SUBMIT_APPROVAL_URL: ${{ secrets.APPROVAL_API_URL }}
        run: python -X utf8 marketing/tools/feedback.py collect --days 10 || echo "collect feedback non bloquant"

      # Assemble le dossier du jour marketing/JOUR/{date}/ (tout le contenu réuni,
      # images copiées + format naturel) et le committe dans fc-pronox. Non
      # destructif + idempotent → un re-run (secours) complète le dossier.
      - name: Assembler le dossier du jour (JOUR/) + commit fc-pronox
        if: github.event.inputs.dry_run != 'true'
        run: |
          DATE=$(TZ=Europe/Paris date +%Y-%m-%d)
          python -X utf8 marketing/tools/build_jour.py --date "$DATE" || { echo "build_jour a échoué (non bloquant)"; exit 0; }
          git config user.name "PronoGo Cloud Jour"
          git config user.email "pronogo.dev@gmail.com"
          git add marketing/JOUR/ marketing/content_machine/FEEDBACK_LOG.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "JOUR/feedback inchangés."; exit 0; fi
          git commit -m "assemble(jour) + feedback $DATE [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "Push JOUR OK."; exit 0; fi
            git pull --rebase origin main; sleep $((i * 3))
          done
          echo "Push JOUR échoué — le prochain run (secours) rattrapera."
