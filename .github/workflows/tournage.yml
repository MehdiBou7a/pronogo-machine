name: "🎬 Tournage automatique (rushes app web) — cloud gratuit"
# LE CAMERAMAN : un Chrome piloté au format téléphone joue un parcours dans
# l'appli web PronoGo et s'enregistre. Rushes committés dans fc-pronox →
# derush.py → Remotion → short. Phase 1 (repérage/itération des parcours).

on:
  schedule:
    - cron: "30 6,12,18 * * *"   # 3 prises/jour — le Réalisateur (routine Claude) règle le parcours 30 min après chaque prise
  workflow_dispatch:
    inputs:
      flow:
        description: "Nom du parcours (marketing/tournage/flows.json) — 'auto' = flow actif"
        type: string
        default: "auto"

permissions:
  contents: read

concurrency:
  group: tournage
  cancel-in-progress: false

jobs:
  tournage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: usine
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Tournage
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          FLOW="${{ github.event.inputs.flow }}"
          python -X utf8 marketing/tools/tournage.py "${FLOW:-auto}"

      - name: Conversion mp4 (si rush produit)
        # Loi anti-échec-silencieux (2026-07-20) : la 1re prise a « réussi » en
        # vert avec `ffmpeg: command not found` — le runner ne l'a PAS d'office.
        # On l'installe, et un échec de conversion FAIT ÉCHOUER le job.
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          for f in marketing/tournage/rushes/*.webm; do
            [ -e "$f" ] || continue
            if ffmpeg -y -loglevel error -i "$f" -c:v libx264 -pix_fmt yuv420p -crf 20 "${f%.webm}.mp4"; then
              rm "$f"
              echo "→ ${f%.webm}.mp4"
            else
              echo "::error::Conversion mp4 ÉCHOUÉE pour $f (le webm est conservé)"
              exit 1
            fi
          done

      - name: Allegement des captures (PNG -> WebP, sans perte de resolution)
        # POURQUOI CETTE ETAPE EXISTE (2026-08-22).
        # Le Cameraman poussait 18,9 Mo par prise, 3 fois par jour depuis le
        # 20/07 : 1 654 Mo d historique en 110 passages, pour un depot qui pese
        # 16 Go alors que le CODE en pese 35 Mo. Mesure de la prise du 22/08 :
        #     tour_onglets.mp4     11 717 280 o   62 %   -> le Monteur
        #     8 captures PNG        7 561 842 o   38 %   -> le Realisateur
        # Le Monteur NE TOURNE PAS (sa porte « tournage pret » n a jamais ete
        # ouverte). 62 % du poids etait donc une video que personne n ouvrait.
        #
        # WebP q85 a PLEINE RESOLUTION : 7 561 842 -> 895 654 o, soit /8,4, et
        # le Realisateur lit toujours les petits chiffres (verifie en REGARDANT
        # un avant/apres, pas en le supposant).
        run: |
          pip install --quiet pillow
          python -X utf8 marketing/tools/alleger_rushes.py

      - name: Commit captures (+ rush video seulement si le Monteur mange)
        run: |
          git config user.name "PronoGo Cameraman"
          git config user.email "pronogo.dev@gmail.com"

          # Les .webp NE SONT PAS ignores par .gitignore, et c est VOULU : c est
          # par la que le Realisateur voit. Les .png et .mp4 le sont depuis le
          # 22/08, donc `git add` les saute -- SANS UN MOT, c est le piege de
          # cette commande sur un DOSSIER. D ou le controle explicite plus bas.
          git add -A -- marketing/tournage/rushes/

          # LA VIDEO N ENTRE QUE LE JOUR OU QUELQU UN LA MANGE.
          # short.yml (le Monteur) ne se declenche que si le Realisateur a ecrit
          # « tournage pret » dans son journal. Tant que cette porte est fermee,
          # committer 11,7 Mo trois fois par jour n alimente personne.
          if grep -qiE "tournage pret|tournage pr.t" marketing/tournage/JOURNAL_REALISATEUR.md 2>/dev/null; then
            echo "Porte du Monteur OUVERTE -> la video part avec les captures."
            for v in marketing/tournage/rushes/*.mp4; do
              [ -e "$v" ] || continue
              git add -f "$v"
            done
          else
            echo "Porte du Monteur FERMEE -> video gardee sur le runner, hors depot."
          fi

          # UN VERT MUET EST UNE PANNE. Si la prise a produit des captures et que
          # rien n est en index, c est que quelque chose les a avalees (un
          # .gitignore elargi, un chemin renomme). Avant le 22/08 ce cas sortait
          # en `exit 0` : le job restait vert et le Realisateur devenait aveugle
          # sans qu aucune alerte ne parte. On ECHOUE, bruyamment.
          captures=$(ls -1 marketing/tournage/rushes/*/*.webp 2>/dev/null | wc -l)
          if git diff --cached --quiet; then
            if [ "$captures" -gt 0 ]; then
              echo "::error::$captures capture(s) sur le disque et RIEN en index."
              echo "::error::Le depot ne les voit pas -- verifier que *.webp sous"
              echo "::error::marketing/tournage reste SUIVI par git, et les chemins."
              exit 1
            fi
            echo "Aucune capture produite et rien a committer -- prise vide."
            exit 0
          fi

          git commit -m "tournage($(date -u +%Y-%m-%d)) captures [cloud]"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:usine; then echo "Push OK."; exit 0; fi
            git pull --rebase --autostash origin usine; sleep $((i * 3))
          done
          # Avant le 22/08 il n y avait RIEN ici : cinq echecs de push rendaient
          # la main en VERT. Meme famille que le vert muet ci-dessus.
          echo "::error::5 tentatives de push echouees -- rien n est arrive sur usine."
          exit 1
