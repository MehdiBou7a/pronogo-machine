name: "📰 Collecte + textes d'articles (pour le Journaliste Claude) — cloud gratuit"
# Le bac à sable des routines Claude n'a pas accès aux sites de presse (proxy 403).
# GitHub Actions, si : ce workflow collecte les flux ET télécharge les TEXTES des
# articles, puis committe le tout (avec les tampons du jour) → le Journaliste
# Claude (routine 10h15/22h15 Paris) lit depuis son checkout, sans réseau.

on:
  schedule:
    # Retard GH mesuré 23-26/07 sur ce repo : matin +1h56 à +2h33, soir +1h07 à +1h18.
    # Chaîne événementielle 26/07 : le Journaliste (routine Claude, à l'heure) passe à
    # 06:30 et 20:30 UTC — chaque passage principal garde ≥3h45 de marge sur lui, le
    # filet re-collecte plus frais si GH est rapide (sinon sans effet : tampon déjà posé).
    - cron: "40 2 * * *"   # 04h40 Paris (été) — principal MATIN
    - cron: "10 4 * * *"   # 06h10 Paris (été) — filet MATIN
    - cron: "10 16 * * *"  # 18h10 Paris (été) — principal SOIR
    - cron: "40 17 * * *"  # 19h40 Paris (été) — filet SOIR
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collecte-textes
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: pip install --quiet feedparser requests

      - name: Collecte + téléchargement des textes d'articles
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -X utf8 marketing/tools/rss_ingest.py
          python -X utf8 marketing/tools/dump_textes.py

      - name: Commit (textes + tampons du jour)
        run: |
          git config user.name "PronoGo Collecte"
          git config user.email "pronogo.dev@gmail.com"
          git add marketing/content_machine/infos_du_jour.json \
                  marketing/content_machine/infos_du_jour.json.stamp \
                  marketing/content_machine/textes_articles.json \
                  marketing/content_machine/textes_articles.json.stamp 2>/dev/null || true
          git add marketing/content_machine/ALERTE_gnews.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à committer."; exit 0
          fi
          git commit -m "collecte(textes) $(date -u +%Y-%m-%dT%H:%M) [cloud]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Push OK (essai $i)."; exit 0; fi
            git pull --rebase --autostash origin main; sleep $((i * 3))
          done
          echo "::warning::Push collecte échoué — re-collecté au prochain run. Visible désormais."

  # 🚨 Filet anti-silence (08/08) : si le job ci-dessus ÉCHOUE — y compris dès
  # son PREMIER step (checkout fc-pronox, PAT mort : la panne muette des
  # 07-08/08) — une alerte email part via alerte_echec.yml. Zéro dépendance à
  # fc-pronox, anti-rafale (un seul mail à l'entrée en panne).
  alerte-panne:
    needs: collecte
    if: failure()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alerte_echec.yml
    secrets: inherit
