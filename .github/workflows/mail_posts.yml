name: "📤 Email des posts prêts (léger + lien de validation)"
# Déclenché APRÈS build_menu (menu écrit). Envoie un mail léger : lien de la page
# de validation pour IG/FB + pièces jointes pour X/TikTok.
# Re-câblage cloud-gratuit : sélection des posts par DATE du jour (plus par git
# diff de push) + garde-fou anti-doublon `.mailed_<date>` committé dans fc-pronox
# → sûr à rejouer sur horaire. Destinataire = secret ALERT_EMAIL (jamais en clair
# dans ce fichier public). Le PIN n'est JAMAIS envoyé (2e facteur).

on:
  workflow_run:
    workflows: ["📋 Menu de validation du jour (cloud gratuit)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Ré-envoyer même si déjà mailé aujourd'hui"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: main
          fetch-depth: 50   # profondeur pour retrouver le commit QC « redacteur-en-chef » dans le log

      # ── DATE DU CYCLE (correctif fondateur 01/08) ────────────────────────
      # Le cycle du SOIR se termine APRÈS minuit Paris (usine ~22h-23h40, menu
      # chaîné juste après, cron de secours à 00h30). La date MURALE bascule
      # alors sur J+1 → le menu cherchait les posts de DEMAIN et n'affichait
      # RIEN : « le html se réinitialise à minuit, je ne vois jamais le retour
      # du soir ». Règle : avant 05h00 Paris, on est ENCORE sur le cycle du
      # soir de la veille. Toutes les étapes suivantes utilisent $CYCLE_DATE.
      - name: Date du CYCLE (jamais la date murale)
        run: |
          PH=$(TZ=Europe/Paris date +%H); UH=$(date -u +%H)
          if [ "$PH" -lt 5 ]; then
            CD=$(TZ=Europe/Paris date -d 'yesterday' +%Y-%m-%d); CN=soir
          else
            CD=$(TZ=Europe/Paris date +%Y-%m-%d)
            CN=$([ "$PH" -lt 17 ] && echo matin || echo soir)
          fi
          if [ "$CN" = "matin" ]; then
            SINCE="$(date -u +%F)T00:00:00Z"
          elif [ "$UH" -lt 15 ]; then
            SINCE="$(date -u -d yesterday +%F)T15:00:00Z"
          else
            SINCE="$(date -u +%F)T15:00:00Z"
          fi
          {
            echo "CYCLE_DATE=$CD"
            echo "CYCLE_NAME=$CN"
            echo "CYCLE_SINCE=$SINCE"
          } >> "$GITHUB_ENV"
          echo "Cycle : $CN du $CD (produit depuis $SINCE)"

      - name: Attendre le QC du Rédacteur en chef (max 60 min, borné avant minuit Paris)
        # Chaîne événementielle 26/07 : le Rédacteur (routine Claude) dépublie les
        # cartes défectueuses juste après l'usine. Le mail attend son commit du CYCLE
        # (matin = aujourd'hui ; soir = après 15:00 UTC) pour ne jamais pointer vers
        # une page qui contient encore des cartes retirées. Jamais bloquant : au bout
        # de 60 min (ou si minuit Paris approche — le comptage est en date Paris), on
        # envoie quand même ; le menu est reconstruit après coup par le Rédacteur.
        run: |
          DATE="$CYCLE_DATE"
          CYCLE="$CYCLE_NAME"
          if [ -f "marketing/reports/routines/posts/.mailed_${DATE}_${CYCLE}" ]; then
            echo "Déjà mailé ($CYCLE) le $DATE → pas d'attente (le step suivant va skipper)."; exit 0
          fi
          SINCE="$CYCLE_SINCE"
          echo "Attente d'un commit 'redacteur-en-chef' postérieur à $SINCE"
          for i in $(seq 1 20); do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$(git log --since="$SINCE" --grep='redacteur-en-chef' --format=%h -1)" ]; then
              echo "✅ QC du Rédacteur trouvé (essai $i) — envoi."
              exit 0
            fi
            PH=$(TZ=Europe/Paris date +%H); PM=$(TZ=Europe/Paris date +%M)
            if [ "$PH" = "23" ] && [ "$PM" -ge 40 ]; then
              echo "::warning::Minuit Paris approche — envoi sans attendre le QC."
              exit 0
            fi
            sleep 180
          done
          echo "::warning::Pas de commit QC après ~60 min — envoi quand même (page reconstruite après coup)."

      - name: Compter les posts du jour (+ anti-doublon)
        id: news
        run: |
          DATE="$CYCLE_DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # marqueur PAR CYCLE (26/07) : avant, .mailed_$DATE journalier = le cycle
          # du SOIR n'envoyait jamais de mail (posts du soir invisibles du fondateur)
          CYCLE="$CYCLE_NAME"
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          DIR="marketing/reports/routines/posts"
          MARKER="$DIR/.mailed_${DATE}_${CYCLE}"
          FORCE="${{ github.event.inputs.force }}"

          if [ -f "$MARKER" ] && [ "$FORCE" != "true" ]; then
            echo "Déjà mailé le $DATE (marqueur présent) → skip."
            echo "should_send=0" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Mail = UN seul lien vers la page unifiée (IG/FB + X/TikTok + vidéo + grille).
          # Plus de pièces jointes : la page montre tout. On compte juste pour le sujet.
          # COMPTE RÉEL (correctif fondateur 01/08 : « les chiffres 48 / 522 /
          # 28 posts prêts sont faux »). Avant : on comptait TOUS les .html du
          # jour → chaque post était compté autant de fois qu'il a de variantes
          # de plateforme (instagram + facebook + x + tiktok…), ET le mail du
          # SOIR recomptait tout le matin. Désormais : un post = un SLUG unique,
          # et seulement ceux AJOUTÉS PENDANT CE CYCLE (git, pas l'horloge).
          COUNT=$(git log --since="$CYCLE_SINCE" --diff-filter=A --name-only --format= -- "$DIR" \
            | grep -E "^${DIR}/${DATE}_[a-z0-9]+_.+\.html$" \
            | sed -E "s#^${DIR}/${DATE}_[a-z0-9]+_##; s#\.html$##" \
            | sort -u | wc -l | tr -d ' ')
          [ -z "$COUNT" ] && COUNT=0
          echo "Posts distincts produits pendant le cycle $CYCLE : $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "Aucun post daté du $DATE → rien à envoyer."
            echo "should_send=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "should_send=1"     >> "$GITHUB_OUTPUT"
          echo "total_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Composer le corps + les pièces jointes (grille · calendrier % · pack usine)
        if: steps.news.outputs.should_send == '1'
        id: extras
        env:
          APPROVAL_LINK_TOKEN: ${{ secrets.APPROVAL_LINK_TOKEN }}
        run: |
          DATE="${{ steps.news.outputs.date }}"
          python -X utf8 marketing/tools/mail_extras.py --date "$DATE"             --count "${{ steps.news.outputs.total_count }}"             --link "https://pronogo-valider.web.app/?token=$APPROVAL_LINK_TOKEN" > /tmp/mail_body.txt
          ATT=""
          GRILLE="marketing/JOUR/$DATE/${DATE}_grille.png"
          [ -f "$GRILLE" ] && ATT="$GRILLE"
          USINE="marketing/reports/routines/usine/$DATE.html"
          [ -f "$USINE" ] && ATT="$ATT,$USINE"
          echo "attachments=${ATT#,}" >> "$GITHUB_OUTPUT"

      - name: Envoyer l'email léger (Brevo SMTP)
        if: steps.news.outputs.should_send == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.BREVO_SMTP_USER }}
          password: ${{ secrets.BREVO_SMTP_KEY }}
          subject: "📤 PronoGo (${{ steps.news.outputs.cycle }}) — ${{ steps.news.outputs.total_count }} post(s) prêt(s) à valider"
          to: ${{ secrets.ALERT_EMAIL }}
          reply_to: pronogo.dev@gmail.com
          from: "PronoGo Machine <pronogo.dev@gmail.com>"
          attachments: ${{ steps.extras.outputs.attachments }}
          body: file:///tmp/mail_body.txt

      - name: Marquer comme mailé (anti-doublon, committé dans fc-pronox)
        if: steps.news.outputs.should_send == '1'
        run: |
          DATE="${{ steps.news.outputs.date }}"
          MARKER="marketing/reports/routines/posts/.mailed_${DATE}_${{ steps.news.outputs.cycle }}"
          echo "mailed at $(date -u +%FT%TZ)" > "$MARKER"
          git config user.name "PronoGo Cloud Mailer"
          git config user.email "pronogo.dev@gmail.com"
          git add "$MARKER"
          git commit -m "state(mail) marqueur anti-doublon $DATE [skip ci]" || { echo "rien à committer"; exit 0; }
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true; sleep $((i * 3))
          done
          echo "::warning::Push marqueur échoué — au pire un 2e mail partira. Bénin mais VISIBLE désormais."
