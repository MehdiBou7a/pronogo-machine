name: "☁️ Publication IG/FB automatique (cloud gratuit)"
# Publie sur IG/FB les posts APPROUVÉS+dus (décisions lues via la CF submitApproval).
# Gardes-fous conservés : PAUSE_AUTOPUBLISH (fichier dans fc-pronox = stop),
# porte d'approbation (silence = hold), anti-redondance, .published.json anti-doublon.
#
# ✅ ARMÉ (2026-07-08, GO fondateur) : cron */30 07h-23h Paris + manuel.
#    tant que la machine n'est pas validée. POUR ARMER (publication auto toutes
#    les 30 min), décommenter le bloc `schedule` ci-dessous (via une PR gardée).
on:
  schedule:
    - cron: "*/30 5-21 * * *"   # 07h-23h Paris (été) — ARMÉ le 2026-07-08 (GO fondateur)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Aperçu seulement (--dry), rien ne part"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` (28/08) = SEUL droit ajouté. Il autorise ce job à demander
    # à GitHub un jeton OIDC, échangé ensuite contre l'identité fédérée Google.
    # C'est ce qui remplace le secret FIREBASE_TOKEN. Le reste ne bouge pas.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout fc-pronox (privé)
        uses: actions/checkout@v4
        with:
          repository: MehdiBou7a/fc-pronox
          token: ${{ secrets.FCPRONOX_PAT }}
          ref: usine
          fetch-depth: 1

      - name: Filet — arrêt immédiat si PAUSE_AUTOPUBLISH présent
        run: |
          if [ -f "_PILOTAGE/PAUSE_AUTOPUBLISH" ]; then
            echo "PAUSE_AUTOPUBLISH présent → le job s'arrête ici."
            echo "SKIP_ALL=1" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        if: env.SKIP_ALL != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node (pour firebase-tools)
        if: env.SKIP_ALL != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer firebase-tools
        if: env.SKIP_ALL != '1'
        run: npm install -g firebase-tools

      # ── IDENTITÉ FÉDÉRÉE GOOGLE (28/08) — remplace le secret FIREBASE_TOKEN ──
      # Ce dépôt est PUBLIC et portait un jeton `firebase login:ci` : TOUS les
      # droits sur le projet Firebase, alors qu'on n'héberge que des vignettes.
      # Désormais : GitHub émet un jeton OIDC de courte durée, Google le vérifie
      # (condition : le dépôt DOIT être MehdiBou7a/pronogo-machine) et rend un
      # accès court au compte de service usine-hosting, qui ne porte QUE
      # roles/firebasehosting.admin et n'a AUCUNE clé. Zéro secret stocké.
      # L'action exporte GOOGLE_APPLICATION_CREDENTIALS → la CLI Firebase le lit
      # seule (cf marketing/tools/build_approval_menu.py::_firebase_auth).
      # ⚠️ Placée APRÈS le checkout (elle écrit dans le workspace, que le checkout
      #    nettoie) et AVANT tout appel à la CLI.
      # ⚠️ Épinglée au SHA de v3.0.0 : une action tierce voit tout ce qui passe
      #    par le job — jamais @main, jamais un tag mouvant.
      - name: Authentification Google (identité fédérée, sans aucun secret)
        if: env.SKIP_ALL != '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/618273407144/locations/global/workloadIdentityPools/github-usine/providers/github"
          service_account: "usine-hosting@fc-pronox.iam.gserviceaccount.com"

      - name: Publier (cloud_publish.py)
        if: env.SKIP_ALL != '1'
        env:
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          APPROVAL_API_URL: ${{ secrets.APPROVAL_API_URL }}
          APPROVAL_LINK_TOKEN: ${{ secrets.APPROVAL_LINK_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry"; fi
          python marketing/tools/cloud_publish.py $ARGS


      # FILET MENU (2026-07-10) : le déclenchement de build_menu par les routines
      # échoue (droits gh manquants côté claude.ai) et les crons GitHub dérivent
      # (menu absent 2 jours de suite au réveil du fondateur). Le publieur, lui,
      # tourne fiablement → il rafraîchit AUSSI le menu de validation à chaque
      # passage. Idempotent (approval_menus/{date} = set sans merge, rejouable).
      - name: Filet — reconstruire le menu de validation (idempotent)
        if: env.SKIP_ALL != '1' && github.event.inputs.dry_run != 'true'
        env:
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: python -X utf8 marketing/tools/build_approval_menu.py || echo "filet menu non bloquant"

      # FILET BOUCLAGE (2026-07-10) : la collecte des retours fondateur vivait
      # aussi dans build_menu (en panne le matin) -> le batch de 11h tournait
      # SANS les lecons de la veille. Le publieur collecte a chaque passage.
      - name: Filet - collecter les retours du fondateur (bouclage)
        if: env.SKIP_ALL != '1' && github.event.inputs.dry_run != 'true'
        env:
          APPROVAL_LINK_TOKEN: ${{ secrets.APPROVAL_LINK_TOKEN }}
        run: python -X utf8 marketing/tools/feedback.py collect --days 10 || echo 'collect non bloquant'

      - name: Committer l'état (si changements)
        if: env.SKIP_ALL != '1' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "PronoGo Cloud Publisher"
          git config user.email "pronogo.dev@gmail.com"
          git add marketing/content_machine/FEEDBACK_LOG.json marketing/content_machine/history.json marketing/reports/routines/posts/.published.json \
                  marketing/reports/routines/posts/.refused.json \
                  marketing/content_machine/CALENDRIER.json \
                  marketing/content_machine/CALENDRIER.html \
                  _PILOTAGE/sync_log.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "state(cloud_publish) publications + refus + calendrier [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:usine; then echo "Push OK (essai $i)."; exit 0; fi
            git pull --rebase origin usine; sleep $((i * 3))
          done
          echo "::error::Push de l'état de publication échoué — le prochain passage risque de REPUBLIER (doublon public). Rouge volontaire." ; exit 1

  # 🚨 Filet anti-silence (08/08) : si le job ci-dessus ÉCHOUE — y compris dès
  # son PREMIER step (checkout fc-pronox, PAT mort : la panne muette des
  # 07-08/08) — une alerte email part via alerte_echec.yml. Zéro dépendance à
  # fc-pronox, anti-rafale (un seul mail à l'entrée en panne).
  alerte-panne:
    needs: publish
    if: failure()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/alerte_echec.yml
    secrets: inherit
