name: test_claude_token
on: workflow_dispatch
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo 'SECRET ABSENT'; exit 1; fi
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p 'Reponds exactement: JETON-OK' --model sonnet 2>&1 | tail -5
